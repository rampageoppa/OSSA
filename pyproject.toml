[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ossa-connectivity"
version = "0.1.0"
description = "Orthogonal Sparse Subgraph Alignment for brain network connectivity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Paper = "https://arxiv.org/abs/2611.14663"
"Project page" = "https://rampageoppa.github.io/projects/ossa/"
Repository = "https://github.com/rampageoppa/OSSA"

[tool.setuptools.packages.find]
where = ["src"]
